name: BOT B - Telegram 06:00 & 11:31 VN

'on':
  schedule:
    - cron: '0 23 * * 0-4'
    - cron: '31 4 * * 1-5'

  workflow_dispatch:
    inputs:
      slot:
        description: 'Chon che do chay'
        required: true
        type: choice
        options:
          - test
          - morning
          - noon
        default: test


permissions:
  contents: read

concurrency:
  group: bot-b-telegram
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      TZ: Asia/Ho_Chi_Minh
      PYTHONUNBUFFERED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: bot_b_output/cache
          key: bot-b-cache-${{ github.run_id }}
          restore-keys: |
            bot-b-cache-

      - name: Check Telegram credentials
        run: |
          test -n "$BOT_TOKEN" || (echo 'Missing BOT_TOKEN'; exit 1)
          test -n "$CHAT_ID" || (echo 'Missing CHAT_ID'; exit 1)

      - name: Run BOT B
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_SLOT: ${{ inputs.slot }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SLOT="$REQUESTED_SLOT"
          elif [ "$EVENT_SCHEDULE" = '0 23 * * 0-4' ]; then
            SLOT=morning
          else
            SLOT=noon
          fi

          echo "Slot: $SLOT"

          if [ "$SLOT" = test ]; then
            python bot_b.py --telegram-test
          else
            python bot_b.py --slot "$SLOT" --delay 0.7
          fi

      - name: Save cache
        if: ${{ always() && hashFiles('bot_b_output/cache/**') != '' }}
        uses: actions/cache/save@v4
        with:
          path: bot_b_output/cache
          key: bot-b-cache-${{ github.run_id }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-b-output-${{ github.run_id }}
          path: |
            bot_b_output/*.csv
            bot_b_output/*.txt
          if-no-files-found: ignore
          retention-days: 14
